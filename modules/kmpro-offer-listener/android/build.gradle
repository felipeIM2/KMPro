plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kmproofferlistener'
version = '0.1.0'

android {
  namespace "expo.modules.kmproofferlistener"
  compileSdk 36
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // On-device OCR: the driver apps render the offer card without exposing it
  // through the accessibility tree, so the text has to be read from pixels.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
